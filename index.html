<body>

  <!-- friendly crash guard: never leave the player on a frozen screen -->
  <script>
    window.addEventListener('error', function (e) {
      var app = document.getElementById('app');
      if (!app || app.dataset.crashed) return;
      app.dataset.crashed = '1';
      app.innerHTML = '<div style="max-width:560px;margin:70px auto;padding:26px;text-align:center;font-family:system-ui,sans-serif;color:#ECE6D6">' +
        '<h1 style="font-family:Anton,sans-serif;font-size:40px;margin:0 0 8px">SOMETHING BROKE</h1>' +
        '<p style="color:#928c7c;line-height:1.5">The match was abandoned. Give it a refresh and go again — your record is safe.</p>' +
        '<button onclick="location.reload()" style="margin-top:16px;padding:12px 22px;border:2px solid #ffd23f;background:#ffd23f;color:#171204;font-weight:800;cursor:pointer">Reload →</button></div>';
    });
    // register the service worker for instant repeat loads + offline play (optional, safe to fail)
    if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
  </script>
</body>
